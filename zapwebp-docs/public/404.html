<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found · Zapwebp Docs</title>
    <meta name="description" content="The requested documentation page could not be found." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/zapwebp.svg" />
    <style>
      :root {
        --bg: #f7f7f4;
        --bg-card: #ffffff;
        --border-mid: #e4e6dc;
        --text-primary: #1a1c18;
        --gray-600: #575a52;
        --green-primary: #8dc63f;
        --green-hover: #7bb332;
        --green-alpha-13: rgba(141, 198, 63, 0.13);
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10120f;
          --bg-card: #171a15;
          --border-mid: rgba(255, 255, 255, 0.08);
          --text-primary: #f2f4ee;
          --gray-600: #9da396;
          --green-primary: #a6e22e;
          --green-hover: #baf043;
          --green-alpha-13: rgba(166, 226, 46, 0.14);
        }
      }
      [data-theme="dark"] {
        --bg: #10120f;
        --bg-card: #171a15;
        --border-mid: rgba(255, 255, 255, 0.08);
        --text-primary: #f2f4ee;
        --gray-600: #9da396;
        --green-primary: #a6e22e;
        --green-hover: #baf043;
        --green-alpha-13: rgba(166, 226, 46, 0.14);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background-color: var(--bg);
        background-image: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(141, 198, 63, 0.12), transparent 70%);
        background-repeat: no-repeat;
        color: var(--text-primary);
        font-family: var(--font-sans);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .error-card {
        width: 100%;
        max-width: 520px;
        background: var(--bg-card);
        border: 1px solid var(--border-mid);
        border-radius: 20px;
        padding: 44px 36px;
        text-align: center;
        box-shadow: 0 16px 48px -8px rgba(0, 0, 0, 0.12), 0 4px 16px -2px rgba(0, 0, 0, 0.06);
        position: relative;
        overflow: hidden;
      }
      .brand-row {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: var(--text-primary);
        margin-bottom: 24px;
      }
      .brand-logo {
        width: 32px;
        height: 32px;
      }
      .brand-title {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .error-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 9999px;
        background: var(--green-alpha-13);
        border: 1px solid rgba(141, 198, 63, 0.35);
        color: var(--green-hover);
        font-family: var(--font-mono);
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 16px;
      }
      .error-title {
        font-size: clamp(1.8rem, 4vw, 2.3rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.15;
        margin-bottom: 12px;
      }
      .error-desc {
        font-size: 0.95rem;
        color: var(--gray-600);
        line-height: 1.55;
        margin-bottom: 32px;
      }
      .actions-cluster {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
      }
      @media (min-width: 460px) {
        .actions-cluster {
          flex-direction: row;
        }
      }
      .btn-primary {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        background: var(--green-primary);
        color: #0d0f0c;
        border: none;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .btn-primary:hover {
        background: var(--green-hover);
        transform: translateY(-1px);
      }
      .btn-secondary {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        background: var(--bg);
        color: var(--text-primary);
        border: 1px solid var(--border-mid);
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease;
      }
      .btn-secondary:hover {
        border-color: var(--green-primary);
        transform: translateY(-1px);
      }
      .footer-meta {
        margin-top: 24px;
        font-size: 0.78rem;
        color: var(--gray-600);
      }
    </style>
  </head>
  <body>
    <main class="error-card">
      <a href="/docs" class="brand-row" aria-label="Zapwebp Documentation">
        <img src="/zapwebp.svg" alt="Zapwebp" class="brand-logo" width="32" height="32" />
        <span class="brand-title">Zapwebp Docs</span>
      </a>

      <div>
        <span class="error-badge">404 · Page Not Found</span>
      </div>

      <h1 class="error-title">Document Not Found</h1>

      <p class="error-desc">
        The documentation article, specification, or guide you requested doesn't exist or may have been moved.
      </p>

      <div class="actions-cluster">
        <a href="/docs" class="btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Overview
        </a>
        <a href="https://zapwebp.vercel.app" class="btn-secondary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Web Converter
        </a>
      </div>

      <p class="footer-meta">Deterministic Transparency Preservation · High-Performance libvips Engine</p>
    </main>

    <script>
      const savedTheme = localStorage.getItem('zapwebp:theme') || localStorage.getItem('zapwebp_theme');
      if (savedTheme && savedTheme !== 'auto') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    </script>
  </body>
</html>
