<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Dark outer rim border gradient -->
    <linearGradient id="zapBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183609" />
      <stop offset="100%" stop-color="#0e2005" />
    </linearGradient>

    <!-- Main Bolt Body Gradient -->
    <linearGradient id="zapFill" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#b4f045" />
      <stop offset="40%" stop-color="#8dc63f" />
      <stop offset="100%" stop-color="#6ba026" />
    </linearGradient>

    <!-- Top Highlight Bevel Gradient -->
    <linearGradient id="zapHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ff85" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#9ce036" stop-opacity="0.05" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- Dark outer rim -->
    <path
      d="M136 18 C144 19 149 26 145 33 L108 82 C106 85 108 89 112 90 L152 100 C159 102 161 110 155 115 L78 181 C71 187 60 181 63 172 L88 116 C90 112 87 108 83 108 L43 108 C36 108 32 100 36 94 L92 23 C96 17 105 16 112 16 Z"
      fill="url(#zapBorder)"
      stroke="url(#zapBorder)"
      stroke-width="7"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Vibrant lime-green core -->
    <path
      d="M136 18 C144 19 149 26 145 33 L108 82 C106 85 108 89 112 90 L152 100 C159 102 161 110 155 115 L78 181 C71 187 60 181 63 172 L88 116 C90 112 87 108 83 108 L43 108 C36 108 32 100 36 94 L92 23 C96 17 105 16 112 16 Z"
      fill="url(#zapFill)"
    />

    <!-- Depth bevel facet highlight -->
    <path
      d="M102 21 L136 21 C141 22 144 26 141 31 L110 75 C108 78 105 79 101 77 L62 55 C58 52 60 46 64 43 L92 23 C95 21 98 21 102 21 Z"
      fill="url(#zapHighlight)"
    />
  </g>
</svg>
