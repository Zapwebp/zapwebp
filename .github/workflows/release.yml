name: Publish packages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm (with retry)
        uses: ./.github/actions/setup-pnpm-retry
        with:
          version: '11.9.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify lockfile synchronization
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version and publish packages via changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: "chore: release packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish VS Code Extension to Open VSX Registry
        if: env.OVSX_PAT != ''
        run: |
          pnpm build:vscode
          cd apps/vscode
          npx --yes @vscode/vsce package --no-dependencies
          npx --yes ovsx publish $(ls *.vsix) -p "${{ env.OVSX_PAT }}"
        env:
          OVSX_PAT: ${{ secrets.OPENVSX_TOKEN || secrets.OVSX_PAT }}
