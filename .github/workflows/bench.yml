name: Performance Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'bench/**'
      - 'packages/cli/**'
  pull_request:
    paths:
      - 'packages/core/**'
      - 'bench/**'
      - 'packages/cli/**'

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm (with retry)
        uses: ./.github/actions/setup-pnpm-retry
        with:
          version: '11.9.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify lockfile synchronization
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Performance Benchmark Suite
        run: pnpm bench

      - name: Upload Benchmark Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: bench/results.json
          retention-days: 14
