name: Real-World E2E Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  real-world-e2e:
    name: E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm (with retry)
        uses: ./.github/actions/setup-pnpm-retry
        with:
          version: '11.9.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify lockfile synchronization
        run: pnpm install --frozen-lockfile --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Real-World Fixture Corpus
        run: node -e "require('./scripts/create-fixtures.js')"

      - name: Run Web Real-World E2E Tests
        run: node --test test/web-real-world.test.js

      - name: Run VS Code Real-World E2E Tests
        run: node --test apps/vscode/test/real-world.test.js

      - name: Build VS Code Extension
        run: pnpm build:vscode
