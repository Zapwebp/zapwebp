name: Production Reliability Matrix & Soak

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly at midnight UTC
    - cron: '0 0 * * *'
    # Weekly Sunday at 04:00 UTC
    - cron: '0 4 * * 0'

jobs:
  reliability-matrix:
    name: Reliability (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Unified Reliability Suite
        run: node --test test/reliability.test.js
      - name: Test Vite Plugin Integration
        run: pnpm --filter @zapwebp/vite test
      - name: Test Next.js Plugin Integration
        run: pnpm --filter @zapwebp/next test
      - name: Test GitHub Action Integration
        run: pnpm --filter @zapwebp/github-action test
      - name: Test Storage Adapters Integration
        run: pnpm --filter @zapwebp/storage test
      - name: Test Crop Plugin Integration
        run: pnpm --filter @zapwebp/crop test
      - name: Test Lens CLI Integration
        run: pnpm --filter @zapwebp/lens test
      - name: Test Laravel Integration
        run: pnpm --filter @zapwebp/laravel test

  nightly-soak:
    name: Extended Nightly Soak & Memory Drift Check
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run Extended Soak Loop (100 iterations)
        run: |
          node -e "
          const { reliability } = require('@zapwebp/shared');
          const { convertImage } = require('@zapwebp/core');
          (async () => {
            const res = await reliability.runSoakTest(
              async () => {
                await convertImage(reliability.PNG_TRANSPARENT_SAMPLE, {
                  to: 'webp',
                  quality: 85,
                  clean: true,
                });
              },
              { iterations: 100, maxRssGrowthMb: 80, name: 'extended-soak-ci' }
            );
            console.log(reliability.formatReliabilityTable());
            if (!res.passed) {
              console.error('Soak test failed memory or leak threshold.');
              process.exit(1);
            }
          })();
          "
