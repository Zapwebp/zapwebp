name: Public Guarantees & Proofs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly determinism run
    - cron: '0 2 * * *'

jobs:
  proofs-matrix:
    name: Guarantees (${{ matrix.os }}, Node 22)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 'Proof 1: Transparency Preservation'
        run: node --test test/proof-transparency.test.js

      - name: 'Proof 2: Verification Enforcement (--verify)'
        run: node --test packages/cli/test/verify.test.js

      - name: 'Proof 3: Reproducible Outputs (MANIFEST.json)'
        run: node --test test/proof-reproducibility.test.js
