name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run validate-locales
      - run: pnpm test
      - run: node -e "JSON.parse(require('node:fs').readFileSync('public/openapi.json', 'utf8'))"
      - run: node --check server.js
      - run: node --check packages/cli/src/index.js
      - run: node --check packages/mcp/src/server.js
      - run: node --check apps/vscode/src/extension.js
      - run: pnpm build:vscode
